schema_version: 1

context:
  version: "0.10.0"
  name: "sparsax"
  python_min: "3.11"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sparsax-${{ version }}.tar.gz
  sha256: 10aae6ebe8debf672ad8948df597d9e5249f585ef45e59dbb5c5c09e3279ca90

build:
  number: 0
  skip:
    - win
    - python < "3.11"
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - scikit-build-core >=0.10
    - nanobind >=2.0
    - jax >=0.9.0
    - pip
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    - suitesparse
    - make

  run:
    - python
    - jax >=0.9.0
    - numpy
    - suitesparse

tests:
  - python:
      imports:
        - sparsax
      pip_check: true

about:
  summary: JAX-native sparse direct solvers via SuiteSparse (CHOLMOD + KLU)
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://github.com/knaaptime/sparsax

extra:
  recipe-maintainers:
    - knaaptime
