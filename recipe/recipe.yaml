schema_version: 1

context:
  version: "0.12.0"
  name: "sparsax"
  python_min: "3.12"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sparsax-${{ version }}.tar.gz
  sha256: 65bada4d41ebde71a616844c9808b5f8ecd3c17afd762cce15a7ab9988d9a80b

build:
  number: 0
  skip:
    - win
    - python < "3.12"
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - scikit-build-core >=0.10
    - nanobind >=2.0
    - jax >=0.11.1
    - pip
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - ninja
    - suitesparse
    - make

  run:
    - python
    - jax >=0.11.1
    - numpy
    - suitesparse

tests:
  - python:
      imports:
        - sparsax
      pip_check: true

about:
  summary: JAX-native sparse direct solvers via SuiteSparse (CHOLMOD, KLU, UMFPACK)
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://github.com/knaaptime/sparsax

extra:
  recipe-maintainers:
    - knaaptime
